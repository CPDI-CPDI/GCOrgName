name: daily-archive

on:
  workflow_run:
    workflows: ["daily-update"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  run-archival:
    name: Run Daily Archival Script
    runs-on: ubuntu-latest

    # Only run when weekly-update succeeded (manual dispatch bypasses this)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Execute Archival Script
        run: |
          python Tools/negative_concordance_commits.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Archives/*.csv
          git diff-index --quiet HEAD || git commit -m "Archival commit"
          git push

      - name: Create GitHub Issue if Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Daily Archive Failed",
              body: "The daily archive workflow failed. Please check the workflow logs for details.",
              labels: ["bug", "auto-generated"]
            })